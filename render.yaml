# Render blueprint - deploys the FastAPI backend on the free tier.
# Deploy: Render dashboard -> New -> Blueprint -> point at this repo.
#
# Notes
# - Free-tier disks are EPHEMERAL: the DB + vector index are rebuilt from the
#   source documents at every boot (app/deploy_bootstrap.py). With the real
#   data pack absent, it falls back to the committed synthetic fixtures so the
#   deployed demo works out of the box.
# - Set ANTHROPIC_API_KEY in the Render dashboard (sync: false = never stored
#   in this file).
# - Set BACKEND_CORS_ORIGINS to your actual Vercel URL after the first deploy.

services:
  - type: web
    name: parcelpilot-agent-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.deploy_bootstrap && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5
      - key: SQLITE_DB_PATH
        value: /tmp/parcelpilot/parcelpilot.db
      - key: VECTOR_STORE_DIR
        value: /tmp/parcelpilot/chroma
      - key: DATA_PACK_DIR
        value: ../data_pack
      # replace with the deployed Vercel origin, comma-separated:
      - key: BACKEND_CORS_ORIGINS
        value: https://parcelpilot-frontend.vercel.app,http://localhost:3000
